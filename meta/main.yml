---
galaxy_info:
  role_name: nut_client
  author: rnissen
  description: >-
    Install and configure a Network UPS Tools (NUT) client that monitors a
    remote upsd as a secondary and shuts the host down after a configurable
    time on battery
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - noble
        - resolute
  galaxy_tags:
    - nut
    - ups
    - upsmon
    - upssched
    - power
    - shutdown

dependencies: []
