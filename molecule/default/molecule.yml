---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: nut-client-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
  - name: nut-client-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
  - name: nut-client-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
  - name: nut-client-ubuntu2604
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      remote_tmp: /var/tmp/.ansible/tmp
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        # TEST-NET address: nothing answers, which is fine — upsmon keeps
        # running and retrying against an unreachable server.
        nut_client_ups_name: ups01
        nut_client_server: 192.0.2.10
        nut_client_password: molecule-not-a-secret
        nut_client_shutdown_delay: 90
    host_vars:
      # Exercise the disabled-timer branch on one platform.
      nut-client-debian13:
        nut_client_shutdown_delay: 0
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    # A dry run against hosts that have never had NUT — the case a fleet
    # converge with check_mode=true hits on first rollout.
    - check
    - converge
    - idempotence
    - verify
    - destroy
